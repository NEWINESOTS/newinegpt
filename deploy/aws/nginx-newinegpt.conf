# newineGPT public demo (14 Nov 2026). Everything on http, including the bare IP address, goes to https://newinegpt.ashinity.com.
# Certificate: Let's Encrypt via certbot (nginx plugin); the certbot timer renews it and the plugin answers the http challenge here.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name newinegpt.ashinity.com;
    location / { return 301 https://newinegpt.ashinity.com$request_uri; }
}
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name newinegpt.ashinity.com;
    ssl_certificate /etc/letsencrypt/live/newinegpt.ashinity.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/newinegpt.ashinity.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 64k;
    location / {
        proxy_pass http://127.0.0.1:7860;
        proxy_set_header Host 127.0.0.1;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
